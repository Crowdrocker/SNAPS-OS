
circle_layout=dwindle,scroller,vertical_scroller,center_tile,tile

tab_bar_height = 0

scratchpad_cross_monitor=1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.15,0.3,0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.75
default_nmaster=1
smartgaps=0
center_when_single_stack=0
center_master_overspread=1

# Overview Setting
hotarea_size=15
enable_hotarea=1
hotarea_corner=0
ov_tab_mode=1
overviewgappi=5
overviewgappo=30

# dwindle settings
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_hsplit=0
dwindle_vsplit=0
dwindle_preserve_split=1
dwindle_smart_resize=0
dwindle_drop_simple_split=0



# ═══════════════════════════════════════════════════════════════════════════════

# ── Per-tag layout ───────────────────────────────────────────────────────────
# niri's scrollable-columns feel is closest to mango's "scroller" layout, so
# that's the default for general-purpose tags. Gaming/Stream/Media get
# "monocle" (one window fills the tag) since that's what "open-maximized"
# was doing for those apps in niri — a single game/stream window filling the
# screen with no visible tiling.

# ═══════════════════════════════════════════════════════════════════════════════
# PER-MONITOR TAG LAYOUTS
# ═══════════════════════════════════════════════════════════════════════════════

# DP-2 (Primary Gaming & Dev Monitor)
tagrule=id:1,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:2,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:3,monitor_name:^DP-2$,layout_name:monocle
tagrule=id:4,monitor_name:^DP-2$,layout_name:scroller
tagrule=id:5,monitor_name:^DP-2$,layout_name:monocle

# DP-1 (Secondary / Media / Chat Monitor)
tagrule=id:1,monitor_name:^DP-1$,layout_name:monocle
tagrule=id:2,monitor_name:^DP-1$,layout_name:scroller
tagrule=id:3,monitor_name:^DP-1$,layout_name:scroller
tagrule=id:4,monitor_name:^DP-1$,layout_name:scroller
tagrule=id:5,monitor_name:^DP-1$,layout_name:scroller
tagrule=id:6,monitor_name:^DP-1$,layout_name:scroller


# ═══════════════════════════════════════════════════════════════════════════════
# APPLICATION ROUTING
# ═══════════════════════════════════════════════════════════════════════════════

# Tag 1 (DP-2) - Web Browsers
windowrule=tags:1,monitor:DP-2,appid:^(brave-browser|firefox|Vivaldi-stable|chromium|zen-alpha|google-chrome)$

# Tag 2 (DP-2) - Development / Editors
windowrule=tags:2,monitor:DP-2,appid:^(code|org\.kde\.kate)$

# Tag 3 (DP-2) - Gaming & Launchers
windowrule=tags:3,monitor:DP-2,appid:^(steam|lutris|heroic|battle\.net\.exe|UbisoftConnect\.exe|steam_app_.*)$
windowrule=isfullscreen:1,tags:3,monitor:DP-2,title:^(Cyberpunk 2077|Fallout4|The Division 2)$

# Tag 4 (DP-2) - Photo & Design
windowrule=tags:4,monitor:DP-2,appid:^(gimp|gimp-2\.10|darktable|krita|inkscape|digikam|rawtherapee)$

# Tag 5 (DP-2) - Media Production
windowrule=tags:5,monitor:DP-2,appid:^(resolve|kdenlive)$

# Secondary Monitor (DP-1) Assignments
windowrule=tags:1,monitor:DP-1,appid:^com\.obsproject\.Studio$,isopensilent:1
windowrule=tags:2,monitor:DP-1,appid:^(discord|telegramdesktop|slack)$
windowrule=tags:3,monitor:DP-1,appid:^spotify$
windowrule=tags:4,monitor:DP-1,appid:^(thunar|dolphin)$r


# Modding tool dialogs -> Gaming, floating
windowrule=isfloating:1,tags:3,monitor:DP-2,title:^(Vortex|Mod Organizer|Mod Organizer 2|Wabbajack|Special Offers|Friends List|Steam Settings)$
windowrule=isfloating:1,tags:3,monitor:DP-2,appid:^com\.nexusmods

# Steam toast notifications, pinned near bottom-right (approximation of
# niri's default-floating-position — see NOTES.md for why it's not exact)
windowrule=isfloating:1,offsetx:90,offsety:90,appid:^steam$,title:^notificationtoasts_\d+_desktop$

# Modpack (Wabbajack: The Midnight Ride) -> Misc (DP-1 tag 5)
## windowrule=tags:5,monitor:DP-1,appid:^steam_app_0$

