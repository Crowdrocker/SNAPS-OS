# XDG Desktop Portal
env=XDG_CURRENT_DESKTOP,wlroots
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,wlroots
env=XDG_SESSION_CLASS,user

# QT
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_QPA_PLATFORMTHEME_QT6,qt6ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_AUTO_SCREEN_SCALE_FACTOR,1

# GTK
env=GDK_SCALE,1
env=GDK_BACKEND,wayland
#env=GTK_THEME,adw-gtk3-dark

# Browser Wayland support
env=MOZ_ENABLE_WAYLAND,1
env=CHROMIUM_FLAGS,--enable-features=UseOzonePlatform --ozone-platform=wayland

# AMD GPU specific optimizations
# NOTE: RADV_PERFTEST's value itself contains a comma ("aco,rt"). mango's env=
# parser splits on the FIRST comma only (KEY,VALUE), so this should come through
# intact — but if RADV features don't seem to apply, set it in a shell profile
# or /etc/environment instead as a fallback.
# ═══════════════════════════════════════════════════════════════════════════════
# AMD RX 580 (Polaris) & RADV Optimizations for CachyOS
# ═══════════════════════════════════════════════════════════════════════════════

# Core Vulkan & OpenGL Drivers
env=AMD_VULKAN_ICD,RADV
env=LIBVA_DRIVER_NAME,radeonsi
env=VDPAU_DRIVER,radeonsi
env=mesa_glthread,true

# RADV Shader & Rendering Tweaks
# fastclears: Speeds up frame buffer clears
# tc_compat_cm: Optimizes color-compressed texture cache memory
env=RADV_PERFTEST,fastclears,tc_compat_cm

# Latency & Sync Optimizations
env=ENABLE_LAYER_MESA_ANTI_LAG,1

# DXVK / VKD3D-Proton Tuning
env=DXVK_ASYNC,1
env=RADV_TEX_ANISO,16
# ═══════════════════════════════════════════════════════════════════════════════

# Set the cursor size for xcursor
env=XCURSOR_SIZE,24

# Disable appimage launcher by default
env=APPIMAGELAUNCHER_DISABLE,1

# Electron apps Wayland support
env=OZONE_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
# SDL Wayland support
env=SDL_VIDEODRIVER,wayland

# Clutter Wayland support
env=CLUTTER_BACKEND,wayland

# Java applications fix
env=_JAVA_AWT_WM_NONREPARENTING,1

# Wine/Proton
env=WINEDEBUG,-all


# Use Plasma's app-menu prefix so kbuildsycoca6 indexes .desktop files
# and Dolphin/Nautilus "Open With" menus work correctly.
env=XDG_MENU_PREFIX,plasma-


