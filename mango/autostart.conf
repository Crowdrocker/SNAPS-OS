# background processes

# DBus / portals
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
#exec-once=/usr/libexec/xdg-desktop-portal
exec-once=/usr/libexec/xdg-desktop-portal-wlr
exec-once=/usr/lib/xdg-desktop-portal -r -v
## update tealdeer/tldr
exec-once=tldr --update
## start dsearch file indexer
exec-once=dsearch serve --workers 1 --root ~ --exclude-hidden
## start a polkit agent
exec-once=systemctl --user start hyprpolkitagent
## first-run UI
exec-once=~/.config/sdgos/firstrun.sh
## start nautilus in the background
exec-once=nautilus --gapplication-service
## dankcalendar
# exec-once=dcal run -d --hidden
## wayshell daemon
exec-once=~/.config/sdgos/wayshell/wayshell.sh
## opentabletdriver
exec-once=systemctl --user start opentabletdriver

# Core (authentication)
exec-once=gnome-keyring-daemon --start --components=secrets

# X11 apps: relax local X access (optional; tighten if you do not need it)
exec-once=sh -c 'xhost +local: 2>/dev/null || true'


# UI
# exec-once=ghostty

# pre-load terminal scratchpad
exec-once=sleep 2.5 && mmsg dispatch toggle_named_scratchpad,com.mitchellh.ghostty,scratchpad-term,'ghostty +new-window --title="scratchpad-term"'
exec-once=sleep 3 && mmsg dispatch toggle_named_scratchpad,com.mitchellh.ghostty,scratchpad-term,'ghostty +new-window --title="scratchpad-term"'
exec-once=sleep 3.5 && mmsg dispatch toggle_named_scratchpad,com.mitchellh.ghostty,scratchpad-term,'ghostty +new-window --title="scratchpad-term"'

# Export XDG_MENU_PREFIX into the systemd user session and rebuild the
# sycoca database so KDE/Qt apps see the correct .desktop entries.
exec-once=bash -c "systemctl --user import-environment XDG_MENU_PREFIX && kbuildsycoca6"
exec-once = kdeconnectd
exec-once = kdeconnect-indicator

# XWayland
exec-once=xwayland-satellite

# Config watcher for real-time validation
exec-once=bash -c "~/.config/wehttamsnaps/scripts/config-watcher.sh start &"

# Save list of currently installed programs
exec-once=~/.config/wehttamsnaps/scripts/save-program-list.sh

exec-once=udiskie --tray
exec-once=blueman-applet
exec-once=nm-applet


# ─── Status Bar ───
# Uncomment if using Waybar. mangowm's own bar is "mangobar" if you want to
# try that instead — see the status-bar wiki page.
# exec-once=waybar
## start DankMaterial Shell
exec-once=dms run

# ─── Polkit Authentication Agent ───
exec-once=/usr/lib/polkit-kde-authentication-agent-1
#exec-once=/usr/lib/polkit-gnome-authentication-agent-1

# ─── Notification Daemon ───
# exec-once=dunst
# exec-once = mako
# ─── Clipboard Manager ───
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

# ─── Sound System ───
# Absolute path here on purpose — exec-once runs early, before your normal
# shell PATH is guaranteed to be set up, and a bare `sound-system` call was
# confirmed to fail the same way it did in keybinds (see NOTES.md).
exec-once=bash -c "/usr/bin/sound-system startup"


# exec-once = sleep 3 && paplay /usr/share/sounds/freedesktop/stereo/message.oga|notify-send --icon ~/.config/Resources/images/PFP.jpg "Welcome back" $USER










