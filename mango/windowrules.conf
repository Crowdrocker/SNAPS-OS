windowrule=isfloating:1,width:1000,height:700,title:^(modding|stl|vortex|mo2)

# ═══════════════════════════════════════════════════════════════════════════════
# TERMINAL (was open-floating false, i.e. tiled — same intent here)
# ═══════════════════════════════════════════════════════════════════════════════
windowrule=force_tiled_state:1,appid:^(com\.mitchellh\.ghostty|kitty|alacritty)$

# Swallow: launching a GUI app from ghostty/kitty replaces the terminal
# window with it, and the terminal comes back when the app closes. Purely
# additive — niri never had this. If a specific app gets annoying to have
# swallow your terminal (e.g. something you want to keep the terminal
# visible alongside), add a line like:
#   windowrule=noswallow:1,appid:some-app-id
windowrule=isterm:1,appid:^(com\.mitchellh\.ghostty|kitty)$

# Translucent terminals. Flat see-through (no blur behind it) since global
# blur is off — the "frosted glass" look needs `blur=1` in
# 80-layout-and-monitors.conf too, which is currently disabled to match your
# old niri look. Turn that on if you want the terminals to actually blur
# what's behind them instead of just fading it.
windowrule=focused_opacity:0.92,unfocused_opacity:0.85,appid:^(com\.mitchellh\.ghostty|kitty)$

# ═══════════════════════════════════════════════════════════════════════════════
